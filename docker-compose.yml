version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: peeps-coffee-db
    restart: always
    environment:
      POSTGRES_DB: coffee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: