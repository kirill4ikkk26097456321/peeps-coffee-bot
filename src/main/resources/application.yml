server:
  port: 8080

spring:
  application:
    name: peeps-coffee-bot
  datasource:
    url: jdbc:postgresql://localhost:5434/coffee_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

telegram:
  bot-token: "dummy"
  chat-id: ""